apiVersion: batch/v1
kind: Job
metadata:
  name: wc-harness
  namespace: wc
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 900
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: wc-harness
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      initContainers:
        - name: seed-prompt
          image: wc-harness:dev
          imagePullPolicy: IfNotPresent
          command: ["cp"]
          args: ["/seed/PROMPT.md", "/workspace/PROMPT.md"]
          volumeMounts:
            - name: prompt
              mountPath: /seed
              readOnly: true
            - name: workspace
              mountPath: /workspace
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      containers:
        - name: wc-harness
          image: wc-harness:dev
          imagePullPolicy: IfNotPresent
          args: ["/workspace"]
          envFrom:
            - secretRef:
                name: wc-llm
          volumeMounts:
            - name: workspace
              mountPath: /workspace
            - name: tmp
              mountPath: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: prompt
          configMap:
            name: wc-prompt
        - name: workspace
          persistentVolumeClaim:
            claimName: wc-workspace
        - name: tmp
          emptyDir: {}
